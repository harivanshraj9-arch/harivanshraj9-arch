<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1E3F"/>
      <stop offset="60%" stop-color="#0F2A5C"/>
      <stop offset="100%" stop-color="#050B1A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Grid pattern (subtle) -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1024" y2="80"/>
    <line x1="0" y1="160" x2="1024" y2="160"/>
    <line x1="0" y1="240" x2="1024" y2="240"/>
    <line x1="0" y1="320" x2="1024" y2="320"/>
    <line x1="0" y1="400" x2="1024" y2="400"/>
  </g>

  <!-- Big P mark on the left -->
  <g transform="translate(140 250)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.9"/>
    <g transform="translate(-72 -120) scale(0.28)">
      <path d="M340 260 L340 780 L440 780 L440 590 L560 590
               C650 590 720 520 720 430
               C720 340 650 260 560 260 Z
               M440 350 L560 350
               C600 350 620 385 620 425
               C620 465 600 500 560 500
               L440 500 Z" fill="#F5F7FA"/>
      <path d="M615 320 L470 545 L555 545 L510 720 L680 465 L590 465 Z"
            fill="url(#bolt)" stroke="#0B1E3F" stroke-width="4"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="320" y="200" fill="#F5F7FA"
        font-family="Arial, sans-serif" font-weight="900" font-size="72" letter-spacing="2">
    PPS Connect
  </text>
  <rect x="320" y="220" width="60" height="6" fill="url(#accent)" rx="3"/>
  <text x="320" y="270" fill="#94A3B8"
        font-family="Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="4">
    PRATHVI POWER SOLUTIONS
  </text>
  <text x="320" y="330" fill="#E2E8F0"
        font-family="Arial, sans-serif" font-weight="600" font-size="24">
    Every operation. One command center.
  </text>

  <!-- Feature chips -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#0B1E3F">
    <g transform="translate(320 380)">
      <rect width="120" height="34" rx="17" fill="#22C55E"/>
      <text x="60" y="22" text-anchor="middle">Expenses</text>
    </g>
    <g transform="translate(450 380)">
      <rect width="90" height="34" rx="17" fill="#0EA5E9"/>
      <text x="45" y="22" text-anchor="middle">HRMS</text>
    </g>
    <g transform="translate(550 380)">
      <rect width="100" height="34" rx="17" fill="#F97316"/>
      <text x="50" y="22" text-anchor="middle">Billing</text>
    </g>
    <g transform="translate(660 380)">
      <rect width="110" height="34" rx="17" fill="#F5F7FA"/>
      <text x="55" y="22" text-anchor="middle">DISCOM</text>
    </g>
  </g>
</svg>
