<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Dark navy rounded background matching brand -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1E3F"/>
      <stop offset="100%" stop-color="#061229"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Circular gradient ring -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="url(#ring)" stroke-width="26"/>

  <!-- Stylized "P" -->
  <path d="M340 260 L340 780 L440 780 L440 590 L560 590
           C650 590 720 520 720 430
           C720 340 650 260 560 260 Z
           M440 350 L560 350
           C600 350 620 385 620 425
           C620 465 600 500 560 500
           L440 500 Z"
        fill="#F5F7FA"/>

  <!-- Lightning bolt through the P -->
  <path d="M615 320 L470 545 L555 545 L510 720 L680 465 L590 465 Z"
        fill="url(#bolt)" stroke="#0B1E3F" stroke-width="4"/>
</svg>
