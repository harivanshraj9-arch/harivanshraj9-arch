name: Android APK

on:
  # Auto-build when frontend/android or workflow changes on main
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-build.yml"
  # Or trigger manually from the Actions tab in GitHub
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Build web bundle
        run: |
          cd frontend
          yarn build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x frontend/android/gradlew

      # --- DEBUG APK (default — no keystore needed) ---
      - name: Build debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: pps-connect-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # --- RELEASE APK (only when build_type = release; needs secrets configured) ---
      - name: Decode release keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing. See DIRECT_INSTALL.md §5."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > frontend/android/app/pps-release.keystore
          cat > frontend/android/key.properties <<EOF
          storeFile=app/pps-release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          cd frontend/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload release APK artifact
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: pps-connect-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Print install hint
        run: |
          echo "::notice::APK built. Download from the 'Artifacts' section on the run summary page and side-load onto your Android phone."
